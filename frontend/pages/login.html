<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Administration – Les Restos du Cœur Charente</title>
  <link rel="stylesheet" href="/css/output.css" />
</head>
<body class="flex min-h-screen bg-gray-100 font-sans">
  <div class="flex w-full min-h-screen">
    <!-- Panel gauche -->
    <div class="hidden md:flex w-2/5 bg-black flex-col justify-between p-12 relative overflow-hidden">
      <div class="absolute -top-32 -right-20 w-96 h-96 rounded-full bg-pink-600 opacity-10"></div>
      <div class="absolute -bottom-14 -left-14 w-72 h-72 rounded-full bg-yellow-500 opacity-10"></div>

      <div class="relative z-10">
        <div class="flex items-center gap-3 mb-12">
          <img src="https://ad16.restosducoeur.org/wp-content/themes/associations-dep/img/logo.svg" alt="Logo" class="w-13">
          <div>
            <p class="text-white font-syne text-[15px] font-extrabold uppercase">Les Restos du Cœur</p>
            <span class="text-pink-600 font-syne text-[13px] font-bold uppercase">Charente</span>
          </div>
        </div>
        <div class="mb-12">
          <h1 class="text-white font-syne text-4xl font-extrabold leading-tight mb-4">
            Espace<br /><em class="not-italic text-pink-600">Administration</em>
          </h1>
          <p class="text-gray-400 text-sm max-w-xs leading-relaxed">
            Gérez les événements et les gazettes de votre association en toute simplicité.
          </p>
        </div>
      </div>

      <div class="text-gray-500 text-xs relative z-10">Accès réservé aux administrateurs</div>
    </div>

    <!-- Panel droit -->
    <div class="flex-1 flex items-center justify-center p-12 bg-white">
      <div class="w-full max-w-md">
        <h2 class="font-syne text-2xl font-extrabold text-gray-900 mb-1">Connexion</h2>
        <p class="text-gray-500 text-xs mb-9">Entrez vos identifiants pour accéder au tableau de bord.</p>

        <div class="hidden bg-red-100 border border-pink-300 text-pink-600 text-xs px-4 py-2 rounded mb-4" id="error-msg"></div>

        <form id="login-form">
          <div class="mb-5">
            <label for="email" class="block text-xs font-bold uppercase tracking-wider text-gray-900 mb-2">Email</label>
            <input type="email" id="email" placeholder="admin@restosducoeur16.fr" required autocomplete="email" class="w-full p-3 border-2 border-gray-200 rounded-md text-gray-900 focus:border-pink-600 outline-none">
          </div>

          <div class="mb-5">
            <label for="password" class="block text-xs font-bold uppercase tracking-wider text-gray-900 mb-2">Mot de passe</label>
            <input type="password" id="password" placeholder="••••••••" required autocomplete="current-password" class="w-full p-3 border-2 border-gray-200 rounded-md text-gray-900 focus:border-pink-600 outline-none">
          </div>

          <button type="submit" id="submit-btn" class="w-full p-4 bg-pink-600 text-white font-syne font-bold text-xs uppercase tracking-wider rounded-md hover:opacity-90 disabled:opacity-50 disabled:cursor-not-allowed mt-2">Se connecter</button>
        </form>

        <a href="/index.html" class="block text-center text-xs text-gray-500 mt-6 hover:text-pink-600">← Retour au site</a>
      </div>
    </div>
  </div>
  <script type="module" src="/api/login.api.js"></script>
</body>
</html>
